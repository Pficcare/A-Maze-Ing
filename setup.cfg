# Linter configuration.
#
# The subject asks for `flake8 .` and `mypy .`, both walking the whole
# directory. Without the exclusions below they would also walk venv/
# (30k+ warnings coming from the installed dependencies), test.py
# (notes, holding a syntax error that stops mypy outright) and
# grid_test.py (the original prototype, kept as a sandbox).

[flake8]
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    test.py,
    grid_test.py

[mypy]
exclude = (?x)(
    ^venv/
    | ^\.venv/
    | ^build/
    | ^dist/
    | ^test\.py$
    | ^grid_test\.py$
  )
